# Base URL of the CertWarden instance
# required
base_url: "https://certwarden.example.com"

# Set this to true if your CertWarden instance does not have a publicly trusted 
# TLS certificate (e.g. it has a self signed one)
# default is false
disable_certificate_validation: false

# run-wide switches for the post-rollout actions
actions:

  # set to false to deploy the certificate files but skip every action
  # the --no-actions flag does the same and overrides this setting
  # default is true
  enabled: true

# Default API-Key for every certificate below that does not set its own
# cert_secret / key_secret. Supports the same ${ENV} and file: references.
# optional
# default_cert_secret: "${CERTWARDEN_CERT_SECRET}"
# default_key_secret: "${CERTWARDEN_KEY_SECRET}"

# define all managed certificates here
certificates:

    # name is a unique identifier that must start and end with an alphanumeric character, 
    # and can contain the following characters: a-zA-Z0-9._-
    # required
  - name: test-certificate.example.com

    # Contains the API-Key to fetch the certificate from the server
    # required, unless CERTWARDEN_API_KEY is set in the environment
    #
    # Instead of a literal key, this may also reference the value:
    #   cert_secret: "${CERTWARDEN_APP_CERT_SECRET}"                   # read from the environment
    #   cert_secret: "file:/run/credentials/certwarden.service/cert"   # read from a file, trimmed
    # Use $${ if you need a literal value that starts with ${
    cert_secret: examplekey_notvalid_hrzjGDDw8z

    # path where to save the certificate
    # required
    cert_path: "/path/to/test-certificate.example.com-cert.pem"

    # Contains the API-Key to fetch the private key from the server
    # required when key_path is set, unless CERTWARDEN_API_KEY is set
    # supports the same ${ENV} and file: references as cert_secret
    key_secret: examplekey_notvalid_hrzbbDDw8z

    # path where to save the private key
    # required
    key_path: "/path/to/test-certificate.example.com-key.pem"

    # path where to save the ca certificate
    ca_path: "/path/to/test-ca-cert.pem"

    # path where to save the certificate and the private key in one file
    # optional, needs cert_secret and key_secret to be set
    privatecert_path: "/etc/haproxy/certs/app.pem"

    # container to request for privatecert_path: pem, pkcs12 or jks
    # optional, default is pem
    #
    # NOTE: change detection hashes the bytes the server returns. It is not
    # verified whether CertWarden rebuilds pkcs12/jks containers per request;
    # if it does, every run counts as changed and the action runs every time.
    privatecert_format: "pem"

    # path where to save the certificate, the private key and the ca chain in one file
    # optional, needs cert_secret and key_secret to be set
    privatecertchain_path: "/etc/haproxy/certs/app-fullchain.pem"

    # container to request for privatecertchain_path: pem, pkcs12 or jks
    # optional, default is pem
    privatecertchain_format: "pem"

    # action to run when certificate was updated or --force is on
    # a string is run through /bin/sh, so pipes, redirects, && and quoting work
    #
    # the paths above and the action support these placeholders:
    #   {name}, {common_name}, {cert_id}  the certificate name
    #   {date}                            the run date as YYYYMMDD
    #   {base_url}                        the base_url set above
    # the action additionally supports the expanded paths:
    #   {cert_path}, {key_path}, {ca_path}, {privatecert_path}, {privatecertchain_path}
    #
    # unrecognised placeholders are left as-is and reported with a warning
    action: "/usr/bin/systemctl reload caddy"

    # a list is executed directly without a shell instead, which is the safer
    # choice when an argument contains spaces. Every argument is expanded on its
    # own, so a placeholder that is a whole argument stays one argument:
    # action:
    #   - /usr/local/bin/deploy
    #   - --cert
    #   - "{cert_path}"
    #   - --note
    #   - "cert renewed"

    # when to run the action:
    #   new            only when a file did not exist on disk before
    #   changed        only when a file existed and its content differed
    #   new_or_changed whenever a file was written (default)
    #   all            on every run, even when nothing was written
    # --force runs the action regardless of this setting
    # default is new_or_changed
    run_on: "new_or_changed"


# Optional block that tunes how requests to the CertWarden server are made
# http:
#   # Extra headers sent with every request, for deployments behind an
#   # authenticating proxy (Cloudflare Access, Authelia, oauth2-proxy, ...).
#   # Values support the same ${ENV} and file: references as the secrets.
#   # X-API-Key and User-Agent are owned by this tool and cannot be overridden.
#   headers:
#     CF-Access-Client-Id: "${CF_ACCESS_CLIENT_ID}"
#     CF-Access-Client-Secret: "${CF_ACCESS_CLIENT_SECRET}"
